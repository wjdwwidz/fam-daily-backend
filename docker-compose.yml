services:
  db:
    image: postgres:16-alpine
    container_name: famdaily-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: famdaily
      POSTGRES_PASSWORD: famdaily
      POSTGRES_DB: famdaily
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
